<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>外賣分帳助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f6f4;
      --ink:#232826;
      --muted:#838985;
      --line:#cfd3cf;
      --accent:#bf2326;
      --paper:#f9f9f7;
      --chip:#e9ebe8;
      --soft:#eef0ec;
      --ok:#2f7451;
      --danger:#b53f3f;
      --radius:0;
      --headline:"Space Grotesk", "Noto Sans TC", "PingFang HK", sans-serif;
      --body:"Work Sans", "Noto Sans TC", "PingFang HK", sans-serif;
      --mono:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--ink);
      min-height:100%;
      font-family:var(--body);
    }

    .page{
      max-width:1500px;
      margin:0 auto;
      padding:56px 24px 28px;
      min-height:100vh;
    }

    .layout{
      display:grid;
      grid-template-columns:1.05fr 1.75fr 1.25fr;
      border-left:1px dashed var(--line);
      border-right:1px dashed var(--line);
      min-height:calc(100vh - 84px);
    }

    .col{
      padding:34px 34px 26px;
      min-width:0;
    }

    .col + .col{
      border-left:1px dashed var(--line);
    }

    .tear-top{
      height:8px;
      margin:-34px -34px 28px;
      background-image:radial-gradient(circle, transparent 70%, var(--line) 72%);
      background-size:12px 12px;
      background-position:0 -6px;
      background-repeat:repeat-x;
    }

    .ledger-title{
      margin:0;
      font-family:var(--headline);
      font-size:clamp(30px, 3.2vw, 56px);
      line-height:1.02;
      letter-spacing:-.03em;
      font-weight:700;
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    .subtle-label{
      margin:0 0 8px;
      font-family:var(--headline);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.22em;
      color:var(--muted);
      font-weight:600;
    }

    .meta-block{
      margin-top:34px;
    }

    .meta-value{
      margin:0;
      font-family:var(--headline);
      font-size:clamp(28px, 2.2vw, 42px);
      line-height:1;
      font-weight:700;
      letter-spacing:-.03em;
    }

    .meta-small{
      margin-top:6px;
      color:#9aa09d;
      font-family:var(--headline);
      font-size:11px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .bill-box{
      margin-top:58px;
    }

    .money-line{
      position:relative;
      border-bottom:1px dashed var(--line);
      padding-bottom:6px;
    }

    .currency{
      position:absolute;
      left:0;
      bottom:10px;
      font-family:var(--headline);
      font-size:38px;
      color:#6d7671;
      font-weight:500;
    }

    .input{
      width:100%;
      border:none;
      border-bottom:1px dashed rgba(154, 159, 155, .45);
      background:transparent;
      min-height:42px;
      padding:8px 2px;
      font-family:var(--body);
      font-size:20px;
      color:var(--ink);
      outline:none;
      border-radius:0;
    }

    .input:focus{
      border-bottom-color:var(--accent);
    }

    .input.big{
      font-family:var(--headline);
      font-size:clamp(42px, 4.6vw, 66px);
      line-height:1;
      letter-spacing:-.03em;
      font-weight:700;
      border-bottom:none;
      min-height:74px;
      padding:0 0 0 46px;
    }

    .line-note{
      margin-top:8px;
      font-family:var(--headline);
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:#9aa09d;
      font-weight:600;
    }

    .receipt-line{
      margin-top:auto;
      padding-top:18px;
      border-top:1px dashed var(--line);
      display:flex;
      justify-content:space-between;
      gap:10px;
      font-family:var(--headline);
      font-size:12px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:#8e958f;
      font-weight:600;
    }

    .receipt-line strong{
      font-weight:700;
      color:#6d7470;
    }

    .col-head{
      display:flex;
      justify-content:space-between;
      gap:14px;
      align-items:flex-end;
      margin-bottom:30px;
    }

    .section-title{
      margin:0;
      font-family:var(--headline);
      letter-spacing:.06em;
      font-size:clamp(28px, 2.8vw, 42px);
      line-height:1.02;
      font-weight:700;
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    .section-title.red{
      color:var(--accent);
    }

    .section-sub{
      margin-top:8px;
      color:#8e9490;
      font-family:var(--headline);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.14em;
      font-weight:600;
    }

    .btn{
      appearance:none;
      border:1px solid #5b615d;
      background:transparent;
      color:var(--ink);
      font-family:var(--headline);
      text-transform:uppercase;
      letter-spacing:.2em;
      font-size:11px;
      font-weight:700;
      padding:11px 14px;
      min-height:40px;
      cursor:pointer;
      transition:.12s ease;
    }

    .btn:hover{
      background:#202624;
      color:#f8f8f6;
      border-color:#202624;
    }

    .btn:active{
      transform:translateY(1px);
    }

    .btn.danger{
      border-color:#b89e9e;
      color:#7e5353;
    }

    .btn.danger:hover{
      background:#7e5353;
      color:#fff;
      border-color:#7e5353;
    }

    .btn.secondary{
      border-style:dashed;
      border-color:#a8aeaa;
    }

    .btn.secondary:hover{
      background:#e4e7e3;
      color:#2a302e;
      border-color:#8e9691;
    }

    .members{
      display:flex;
      flex-direction:column;
      border-top:1px dashed #d5d9d5;
    }

    .member{
      padding:18px 0;
      border-bottom:1px dashed #d5d9d5;
    }

    .member-row{
      display:grid;
      grid-template-columns:46px minmax(0,1fr) 28px;
      gap:16px;
      align-items:start;
    }

    .row-no{
      width:38px;
      height:38px;
      border:1px solid #d0d4d0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:var(--headline);
      font-size:17px;
      color:#6d7470;
      font-weight:700;
      letter-spacing:.04em;
    }

    .entry-grid{
      display:grid;
      grid-template-columns:minmax(0,1fr) 190px;
      gap:20px;
    }

    .entry-field .label{
      display:block;
      margin:0 0 6px;
      font-family:var(--headline);
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.18em;
      color:#8a918c;
      font-weight:600;
    }

    .entry-field .input{
      font-family:var(--headline);
      font-size:clamp(22px, 1.9vw, 32px);
      letter-spacing:-.01em;
      min-height:38px;
      padding:4px 2px;
    }

    .entry-field .input.price{
      text-transform:none;
      text-align:right;
    }

    .remove-btn{
      border:none;
      background:transparent;
      color:#9ea4a0;
      font-size:19px;
      line-height:1;
      padding-top:29px;
      cursor:pointer;
      opacity:.3;
      transition:.15s ease;
    }

    .member:hover .remove-btn{
      opacity:1;
      color:#8d1f22;
    }

    .member-actions{
      margin-top:10px;
      margin-left:62px;
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .tiny-ok{
      color:var(--ok);
      font-family:var(--headline);
      font-size:11px;
      letter-spacing:.05em;
      text-transform:uppercase;
      font-weight:600;
    }

    .saved-wrap{
      margin-bottom:18px;
      padding-bottom:14px;
      border-bottom:1px dashed var(--line);
    }

    .saved-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }

    .saved-names{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .chip{
      border:1px dashed #b7bcba;
      background:var(--chip);
      color:#4d5651;
      font-family:var(--headline);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.13em;
      font-weight:600;
      padding:8px 11px;
      cursor:pointer;
      transition:.12s ease;
    }

    .chip:hover{
      background:#d8ddd8;
      color:#2a312e;
    }

    .toolbar{
      margin-top:16px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .list{
      border-top:1px dashed #d5d9d5;
    }

    .item{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:10px;
      align-items:center;
      padding:20px 0;
      border-bottom:1px dashed #d5d9d5;
    }

    .item-name{
      font-family:var(--headline);
      font-size:clamp(24px, 2.1vw, 34px);
      letter-spacing:-.01em;
      font-weight:700;
      margin-bottom:6px;
      overflow-wrap:anywhere;
      line-height:1;
    }

    .item-meta{
      color:#8a918c;
      font-family:var(--headline);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.13em;
      line-height:1.5;
      font-weight:600;
    }

    .item-right{
      text-align:right;
      min-width:140px;
    }

    .money{
      font-family:var(--headline);
      font-size:clamp(34px, 2.8vw, 52px);
      line-height:1;
      font-weight:700;
      letter-spacing:-.03em;
      color:#202826;
    }

    .item-share{
      margin-top:6px;
      color:#8b928d;
      font-family:var(--headline);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.14em;
      font-weight:600;
    }

    .copy-btn{
      margin-top:8px;
      border:1px dashed #aeb3b0;
      background:transparent;
      font-family:var(--headline);
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.14em;
      padding:6px 8px;
      cursor:pointer;
      color:#5f6762;
      transition:.12s ease;
    }

    .copy-btn:hover{
      background:#e7ebe7;
      color:#24302c;
    }

    .right-footer{
      margin-top:auto;
      padding-top:26px;
      border-top:1px dashed var(--line);
    }

    .grand-box{
      margin-top:24px;
      text-align:center;
      border-top:1px dashed var(--line);
      padding-top:24px;
    }

    .grand-label{
      margin:0 0 12px;
      color:#8d938f;
      font-family:var(--headline);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.2em;
      font-weight:600;
    }

    .grand-total{
      font-family:var(--headline);
      font-size:clamp(52px, 5.2vw, 88px);
      line-height:1;
      letter-spacing:-.04em;
      font-weight:700;
      color:#222a28;
      margin:0;
    }

    .helper-note{
      margin-top:12px;
      color:#8d938f;
      font-family:var(--headline);
      font-size:10px;
      letter-spacing:.12em;
      text-transform:uppercase;
      line-height:1.6;
    }

    @media (max-width:1220px){
      .layout{
        grid-template-columns:1fr;
      }
      .col + .col{
        border-left:none;
        border-top:1px dashed var(--line);
      }
      .tear-top{ display:none; }
      .receipt-line{ margin-top:22px; }
      .section-title{ font-size:32px; }
      .ledger-title{ font-size:40px; }
    }

    @media (max-width:760px){
      .page{
        padding:22px 12px 16px;
      }
      .col{
        padding:18px 14px;
      }
      .entry-grid{
        grid-template-columns:1fr;
        gap:12px;
      }
      .member-row{
        grid-template-columns:40px minmax(0,1fr) 24px;
        gap:10px;
      }
      .member-actions{
        margin-left:0;
      }
      .money{
        font-size:34px;
      }
      .item-name,
      .entry-field .input{
        font-size:22px;
      }
      .grand-total{
        font-size:56px;
      }
      .input.big{
        font-size:50px;
      }
      .col-head{
        align-items:flex-start;
        flex-direction:column;
      }
      .btn{
        width:100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="layout">
      <section class="col">
        <div class="tear-top"></div>
        <h1 class="ledger-title">外賣分帳助手</h1>

        <div class="bill-box">
          <p class="subtle-label">外賣總額</p>
          <div class="money-line">
            <span class="currency">$</span>
            <input id="finalTotal" class="input big" type="number" min="0" step="0.01" placeholder="0.00">
          </div>
          <div class="line-note">此金額會按比例分配</div>
        </div>

        <div class="meta-block" style="margin-top:34px;">
          <p class="subtle-label">收款連結</p>
          <input id="paymentLink" class="input" type="text" placeholder="PayMe / FPS / 其他收款連結">
          <div class="line-note">會自動附加在複製訊息尾段</div>
        </div>

        <div class="meta-block" style="margin-top:28px;">
          <p class="subtle-label">原價總和</p>
          <p class="meta-value" id="rawTotalText">$0.00</p>
        </div>

        <div class="receipt-line">
          <span>最終總額</span>
          <strong id="finalTotalText">$0.00</strong>
        </div>
      </section>

      <section class="col">
        <div class="col-head">
          <div>
            <h2 class="section-title">成員項目</h2>
            <p class="section-sub">逐位輸入原價金額</p>
          </div>
          <button id="addMemberBtn" class="btn" type="button">＋ 新增成員</button>
        </div>

        <section id="savedNamesWrap" class="saved-wrap" style="display:none;">
          <div class="saved-head">
            <p class="subtle-label" style="margin:0;">常用名字</p>
            <button id="clearSavedNamesBtn" class="btn secondary" type="button">清空常用</button>
          </div>
          <div id="savedNames" class="saved-names"></div>
        </section>

        <div id="members" class="members"></div>

        <div class="toolbar">
          <button id="resetAllBtn" class="btn danger" type="button">重置本次資料</button>
        </div>
      </section>

      <section class="col">
        <div class="col-head">
          <div>
            <h2 class="section-title red">分賬結果</h2>
            <p class="section-sub">按原價比例分配</p>
          </div>
        </div>

        <div id="resultsList" class="list"></div>

        <div class="right-footer">
          <button id="copyAllExportBtn" class="btn secondary" type="button">匯出全部結果</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    const STORAGE_KEYS = {
      savedNames: "takeout_split_saved_names_v4",
      paymentLink: "takeout_split_payment_link_v4",
      session: "takeout_split_session_v4"
    };

    const finalTotalInput = document.getElementById("finalTotal");
    const paymentLinkInput = document.getElementById("paymentLink");
    const addMemberBtn = document.getElementById("addMemberBtn");
    const clearSavedNamesBtn = document.getElementById("clearSavedNamesBtn");
    const copyAllExportBtn = document.getElementById("copyAllExportBtn");
    const resetAllBtn = document.getElementById("resetAllBtn");
    const membersEl = document.getElementById("members");
    const resultsListEl = document.getElementById("resultsList");
    const rawTotalText = document.getElementById("rawTotalText");
    const finalTotalText = document.getElementById("finalTotalText");
    const finalTotalMirror = document.getElementById("finalTotalMirror");
    const savedNamesWrap = document.getElementById("savedNamesWrap");
    const savedNamesEl = document.getElementById("savedNames");

    let members = [];

    function uid() {
      return Math.random().toString(36).slice(2, 10);
    }

    function num(v) {
      const n = parseFloat(v);
      return Number.isFinite(n) ? n : 0;
    }

    function round2(n) {
      return Math.round((n + Number.EPSILON) * 100) / 100;
    }

    function fmtMoney(n) {
      return `$${round2(n).toFixed(2)}`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function getSavedNames() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEYS.savedNames) || "[]");
      } catch {
        return [];
      }
    }

    function saveSavedNames(names) {
      localStorage.setItem(STORAGE_KEYS.savedNames, JSON.stringify(names));
    }

    function shouldSaveName(name) {
      const cleaned = String(name || "").trim();
      if (!cleaned) return false;
      if (cleaned.length < 2) return false;
      if (/^\d+$/.test(cleaned)) return false;
      return true;
    }

    function addNameToSaved(name) {
      const cleaned = String(name || "").trim();
      if (!shouldSaveName(cleaned)) return false;

      let names = getSavedNames();
      if (names.includes(cleaned)) return "exists";

      names.push(cleaned);
      names = names.slice(-30);
      saveSavedNames(names);
      renderSavedNames();
      return true;
    }

    function clearSavedNames() {
      localStorage.removeItem(STORAGE_KEYS.savedNames);
      renderSavedNames();
    }

    function renderSavedNames() {
      const names = getSavedNames();
      savedNamesEl.innerHTML = "";

      if (!names.length) {
        savedNamesWrap.style.display = "none";
        return;
      }

      savedNamesWrap.style.display = "block";

      names.forEach(name => {
        const btn = document.createElement("button");
        btn.className = "chip";
        btn.type = "button";
        btn.textContent = name;
        btn.addEventListener("click", () => {
          addMember(name, "");
        });
        savedNamesEl.appendChild(btn);
      });
    }

    function resetCurrentSession() {
      finalTotalInput.value = "";
      paymentLinkInput.value = "";

      members = [
        { id: uid(), name: "", rawPrice: "" },
        { id: uid(), name: "", rawPrice: "" }
      ];

      saveSession();
      renderMembers();
      renderAll();
    }

    function saveSession() {
      const payload = {
        finalTotal: finalTotalInput.value,
        paymentLink: paymentLinkInput.value,
        members
      };

      localStorage.setItem(STORAGE_KEYS.session, JSON.stringify(payload));
      localStorage.setItem(STORAGE_KEYS.paymentLink, paymentLinkInput.value || "");
    }

    function loadSession() {
      const savedPaymentLink = localStorage.getItem(STORAGE_KEYS.paymentLink) || "";
      paymentLinkInput.value = savedPaymentLink;

      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEYS.session) || "null");
        if (data) {
          finalTotalInput.value = data.finalTotal || "";
          paymentLinkInput.value = data.paymentLink || savedPaymentLink || "";
          members = Array.isArray(data.members) ? data.members : [];
        }
      } catch {}

      if (!members.length) {
        members = [
          { id: uid(), name: "", rawPrice: "" },
          { id: uid(), name: "", rawPrice: "" }
        ];
      }

      renderMembers();
      renderAll();
    }

    function addMember(prefillName = "", prefillPrice = "") {
      members.push({
        id: uid(),
        name: prefillName,
        rawPrice: prefillPrice
      });
      renderMembers();
      renderAll();
    }

    function removeMember(id) {
      members = members.filter(m => m.id !== id);
      if (!members.length) {
        members = [{ id: uid(), name: "", rawPrice: "" }];
      }
      renderMembers();
      renderAll();
    }

    function updateMember(id, key, value) {
      members = members.map(m => m.id === id ? { ...m, [key]: value } : m);
      renderResults();
      saveSession();
    }

    function calculate() {
      const finalTotal = num(finalTotalInput.value);
      const rawTotal = round2(members.reduce((sum, m) => sum + num(m.rawPrice), 0));

      const rows = members.map(m => {
        const raw = num(m.rawPrice);
        const ratio = rawTotal > 0 ? raw / rawTotal : 0;
        const shouldPay = round2(ratio * finalTotal);
        return {
          ...m,
          raw,
          ratio,
          shouldPay
        };
      });

      const distributed = round2(rows.reduce((sum, r) => sum + r.shouldPay, 0));
      const diff = round2(finalTotal - distributed);

      if (Math.abs(diff) > 0 && rows.some(r => r.raw > 0)) {
        for (let i = rows.length - 1; i >= 0; i--) {
          if (rows[i].raw > 0) {
            rows[i].shouldPay = round2(rows[i].shouldPay + diff);
            break;
          }
        }
      }

      return { finalTotal, rawTotal, rows };
    }

    function buildCopyText(name, amount) {
      const link = paymentLinkInput.value.trim();
      const personName = name?.trim() || "你";
      let text = `${personName}，今餐外賣你嗰份係 ${fmtMoney(amount)}`;
      if (link) text += ` PayMe 撳呢度：${link}`;
      return text;
    }

    function buildExportText() {
      const { rows } = calculate();
      return rows
        .filter(row => row.name.trim() || row.raw > 0 || row.shouldPay > 0)
        .map(row => `${row.name?.trim() || "未命名"} - ${fmtMoney(row.shouldPay)}`)
        .join("\n");
    }

    async function copyToClipboard(text, btnEl, originalText = null) {
      try {
        await navigator.clipboard.writeText(text);
        if (btnEl) {
          const old = originalText || btnEl.textContent;
          btnEl.textContent = "已複製";
          setTimeout(() => btnEl.textContent = old, 1400);
        }
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        if (btnEl) {
          const old = originalText || btnEl.textContent;
          btnEl.textContent = "已複製";
          setTimeout(() => btnEl.textContent = old, 1400);
        }
      }
    }

    function renderMembers() {
      membersEl.innerHTML = "";

      members.forEach((m, idx) => {
        const wrap = document.createElement("div");
        wrap.className = "member";

        const rowNo = String(idx + 1).padStart(2, "0");

        wrap.innerHTML = `
          <div class="member-row">
            <div class="row-no">${rowNo}</div>

            <div class="entry-grid">
              <div class="entry-field">
                <label class="label">成員名字</label>
                <input class="input" type="text" placeholder="請輸入名字" value="${escapeHtml(m.name)}" data-id="${m.id}" data-key="name">
              </div>

              <div class="entry-field">
                <label class="label" style="text-align:right;">食物原價 ($)</label>
                <input class="input price" type="number" min="0" step="0.01" placeholder="0.00" value="${escapeHtml(m.rawPrice)}" data-id="${m.id}" data-key="rawPrice">
              </div>
            </div>

            <button class="remove-btn" type="button" data-id="${m.id}" aria-label="刪除成員">×</button>
          </div>

          <div class="member-actions">
            <button class="btn secondary save-name-btn" type="button" data-id="${m.id}">儲存名字</button>
            <span class="tiny-ok" id="save-name-status-${m.id}"></span>
          </div>
        `;

        membersEl.appendChild(wrap);
      });

      membersEl.querySelectorAll("input[data-id]").forEach(input => {
        input.addEventListener("input", e => {
          const id = e.target.dataset.id;
          const key = e.target.dataset.key;
          updateMember(id, key, e.target.value);
        });

        input.addEventListener("blur", e => {
          const id = e.target.dataset.id;
          const key = e.target.dataset.key;
          updateMember(id, key, e.target.value.trim());
        });
      });

      membersEl.querySelectorAll(".remove-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          removeMember(btn.dataset.id);
          saveSession();
        });
      });

      membersEl.querySelectorAll(".save-name-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;
          const member = members.find(m => m.id === id);
          const statusEl = document.getElementById(`save-name-status-${id}`);
          if (!member) return;

          const result = addNameToSaved(member.name);

          if (result === true) {
            statusEl.textContent = "已加入常用名字";
          } else if (result === "exists") {
            statusEl.textContent = "名字已存在";
          } else {
            statusEl.textContent = "名字至少要 2 個字";
          }

          setTimeout(() => {
            if (statusEl) statusEl.textContent = "";
          }, 1600);

          saveSession();
        });
      });
    }

    function renderResults() {
      const { finalTotal, rawTotal, rows } = calculate();

      const finalMoney = fmtMoney(finalTotal);
      rawTotalText.textContent = fmtMoney(rawTotal);
      finalTotalText.textContent = finalMoney;
      if (finalTotalMirror) finalTotalMirror.textContent = finalMoney;

      resultsListEl.innerHTML = "";

      rows.forEach(row => {
        const item = document.createElement("div");
        item.className = "item";

        const text = buildCopyText(row.name, row.shouldPay);

        item.innerHTML = `
          <div>
            <div class="item-name">${escapeHtml(row.name || "未命名")}</div>
            <div class="item-meta">原價：${fmtMoney(row.raw)}</div>
          </div>

          <div class="item-right">
            <div class="money">${fmtMoney(row.shouldPay)}</div>
            <div class="item-share">佔比：${(row.ratio * 100).toFixed(1)}%</div>
            <button class="copy-btn" type="button">複製訊息</button>
          </div>
        `;

        const btn = item.querySelector(".copy-btn");
        btn.addEventListener("click", () => copyToClipboard(text, btn, "複製訊息"));

        resultsListEl.appendChild(item);
      });
    }

    function renderAll() {
      renderResults();
      renderSavedNames();
      saveSession();
    }

    addMemberBtn.addEventListener("click", () => {
      addMember();
      saveSession();
    });

    resetAllBtn.addEventListener("click", () => {
      const ok = window.confirm("要重置今次資料嗎？常用名字會保留。");
      if (!ok) return;
      resetCurrentSession();
    });

    clearSavedNamesBtn.addEventListener("click", () => {
      clearSavedNames();
    });

    copyAllExportBtn.addEventListener("click", () => {
      const text = buildExportText();
      copyToClipboard(text, copyAllExportBtn, "匯出全部結果");
    });

    finalTotalInput.addEventListener("input", renderAll);
    paymentLinkInput.addEventListener("input", renderAll);

    loadSession();
  </script>
</body>
</html>
